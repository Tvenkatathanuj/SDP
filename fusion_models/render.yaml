services:
  - type: web
    name: cmafn-fusion
    runtime: python
    rootDir: fusion_models
    buildCommand: git lfs install && git lfs pull && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
