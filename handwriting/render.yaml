services:
  - type: web
    name: pd-handwriting-live-translate
    runtime: python
    rootDir: handwriting
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.7"
